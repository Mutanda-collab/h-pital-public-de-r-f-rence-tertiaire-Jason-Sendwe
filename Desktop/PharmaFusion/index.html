
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaFusion by Dr. Mutanda DB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Orbitron', 'sans-serif'],
          },
          colors: {
            'brand-primary': '#00BFFF', // DeepSkyBlue
            'brand-secondary': '#000080', // DarkSlateBlue
            'dark-bg': '#1a202c',
            'dark-card': '#2d3748',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0, transform: 'translateY(10px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
            slideIn: {
              '0%': { transform: 'translateX(100%)' },
              '100%': { transform: 'translateX(0)' },
            },
            slideInFromLeft: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(0)' },
            },
            'pulse-slow': {
              '0%, 100%': { opacity: 1, transform: 'scale(1)' },
              '50%': { opacity: 0.8, transform: 'scale(1.05)' },
            },
          },
          animation: {
            fadeIn: 'fadeIn 0.5s ease-out forwards',
            slideIn: 'slideIn 0.3s ease-out forwards',
            slideInFromLeft: 'slideInFromLeft 0.3s ease-out forwards',
            'pulse-slow': 'pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        },
      },
    }
  </script>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/"
  }
}
</script>
<style>
    html.text-size-sm { font-size: 14px; }
    html.text-size-base { font-size: 16px; }
    html.text-size-lg { font-size: 18px; }
</style>
<style>
    @media print {
      body * {
        visibility: hidden;
      }
      .printable-area, .printable-area * {
        visibility: visible;
      }
      .printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 1rem;
        font-size: 12pt;
      }
      .no-print {
        display: none !important;
      }
    }
</style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-gray-100 dark:bg-dark-bg transition-colors duration-500">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  
</body>
</html>
